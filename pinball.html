<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로또 핀볼 추첨기</title>
<style>
  :root {
    --bg1: #0a0d22;
    --bg2: #1d1740;
    --panel: rgba(255, 255, 255, 0.08);
    --panel-border: rgba(255, 255, 255, 0.16);
    --text: #f4f6ff;
    --muted: #aab1d6;
    --accent: #ffcc33;
    --accent-2: #4fd1ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 900px at 50% 30%, var(--bg2), var(--bg1) 70%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  #ui > * { pointer-events: auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
  header .title { pointer-events: none; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; text-shadow: 0 2px 12px rgba(0,0,0,.5); word-break: keep-all; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
  header .status { background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 14px; font-size: 13px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
  header .status b { color: var(--accent); font-size: 16px; }
  #mute { background: none; border: 0; color: var(--text); font-size: 16px; cursor: pointer; padding: 0 2px; }
  a.switch { color: var(--muted); font-size: 12px; text-decoration: none; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; padding: 5px 10px; }
  a.switch:hover { color: var(--text); }

  #bottom { display: flex; flex-direction: column; gap: 12px; align-items: center; }

  #tray { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); border-radius: 999px; pointer-events: auto; }
  .slot {
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.28);
    display: grid; place-items: center;
    font-weight: 800; font-size: 22px; color: #111;
    position: relative;
  }
  .slot::after { content: attr(data-i); position: absolute; color: rgba(255,255,255,.35); font-size: 12px; font-weight: 500; }
  .slot.filled { border: 0; box-shadow: 0 6px 18px rgba(0,0,0,.45), inset -6px -8px 14px rgba(0,0,0,.18), inset 6px 8px 14px rgba(255,255,255,.35); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .slot.filled::after { content: ""; }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(12px); border-radius: 16px; padding: 10px 12px; max-width: 100%; }
  button.btn {
    font: inherit; font-weight: 700; font-size: 14px;
    border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    color: #111; background: var(--accent);
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: transform .08s, filter .15s;
  }
  button.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  button.btn.secondary { background: rgba(255,255,255,.14); color: var(--text); }
  button.btn.blue { background: var(--accent-2); }
  button.btn:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 6px; }
  .speed input { width: 110px; accent-color: var(--accent); }

  #hint { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); background: rgba(0,0,0,.45); border: 1px solid var(--panel-border); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 999px; font-size: 13px; color: var(--text); pointer-events: none; transition: opacity .4s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; z-index: 5; }
  #hint.hide { opacity: 0; }

  #result { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 24, .55); backdrop-filter: blur(6px); z-index: 20; padding: 16px; }
  #result[hidden] { display: none; }
  #result .card { background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.06)); border: 1px solid var(--panel-border); border-radius: 22px; padding: 26px 22px; width: min(520px, 100%); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: rise .5s cubic-bezier(.2,1.2,.4,1); }
  @keyframes rise { from { transform: translateY(30px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  #result h2 { margin: 0 0 6px; font-size: 24px; }
  #result .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  #result .nums { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .ball2d { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 24px; color: #111; box-shadow: 0 8px 18px rgba(0,0,0,.45), inset -6px -8px 14px rgba(0,0,0,.18), inset 6px 8px 14px rgba(255,255,255,.4); animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .ball2d.small { width: 34px; height: 34px; font-size: 14px; animation: none; box-shadow: inset -3px -4px 8px rgba(0,0,0,.18), inset 3px 4px 8px rgba(255,255,255,.4); }
  #result .meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.6; }
  #result .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  #history { margin-top: 20px; text-align: left; border-top: 1px solid var(--panel-border); padding-top: 12px; }
  #history summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  #history ul { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow: auto; }
  #history li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  #history li .date { min-width: 96px; }
  #history .clear { margin-top: 8px; background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  #toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 40; }
  #toast.show { opacity: 1; }
  #nowebgl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  @media (max-width: 480px) {
    header h1 { font-size: 18px; }
    header p { display: none; }
    #tray { right: 8px; gap: 6px; padding: 8px 6px; }
    .slot { width: 42px; height: 42px; font-size: 16px; }
    button.btn { padding: 9px 11px; font-size: 13px; }
    .speed input { width: 80px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <header>
    <div class="title">
      <h1>🎯 로또 핀볼 추첨기</h1>
      <p>45개의 공이 랜덤한 자리에서 우르르 떨어져요. GOAL에 먼저 들어온 6개가 당첨!</p>
    </div>
    <div class="right">
      <div class="status"><span>골인 <b id="count">0</b> / 6</span><span id="left" style="color:var(--muted)">남은 공 45</span><button id="mute" title="소리 켜기/끄기">🔊</button></div>
      <a class="switch" href="./index.html">🎱 유리구 버전으로</a>
    </div>
  </header>

  <div id="bottom">
    <div id="controls">
      <button class="btn" id="drop">🎳 공 떨어뜨리기</button>
      <button class="btn secondary" id="reset">↺ 새 판 (핀 재배치)</button>
      <label class="speed">속도 <input type="range" id="speed" min="50" max="200" value="100"></label>
    </div>
  </div>
</div>

<div id="tray">
  <div class="slot" data-i="1"></div>
  <div class="slot" data-i="2"></div>
  <div class="slot" data-i="3"></div>
  <div class="slot" data-i="4"></div>
  <div class="slot" data-i="5"></div>
  <div class="slot" data-i="6"></div>
</div>

<div id="hint">버튼을 누르면 공이 쏟아져요. 블랙홀과 OUT에 빠진 공은 사라집니다!</div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<div id="result" hidden>
  <div class="card">
    <h2>🎉 골인한 행운의 번호</h2>
    <div class="sub" id="resultDate"></div>
    <div class="nums" id="resultNums"></div>
    <div class="meta" id="resultMeta"></div>
    <div class="actions">
      <button class="btn secondary" id="copy">📋 번호 복사</button>
      <button class="btn" id="again">🔁 다시 추첨</button>
    </div>
    <details id="history">
      <summary>최근 추첨 기록</summary>
      <ul id="historyList"></ul>
      <button class="clear" id="clearHistory">기록 지우기</button>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (!window.THREE) {
    document.body.insertAdjacentHTML('beforeend', '<div id="nowebgl">3D 라이브러리를 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>');
    return;
  }

  // ---------- 상수 ----------
  const N = 45;
  const BR = 0.42;          // 공 반지름
  const HW = 8;             // 보드 절반 너비
  const TOP = 12.5;         // 공이 나타나는 높이
  const FLOOR = -9.4;       // 포켓 바닥
  const HIDE_Y = -16;       // 이 아래로 떨어지면 사라짐
  const GOAL_HALF = 2.0;    // GOAL 포켓 절반 너비
  const PICK_MAX = 6;
  const COLOR_RANGES = [[10, '#FBC400'], [20, '#69C8F2'], [30, '#FF7272'], [40, '#AAAAAA'], [45, '#B0D840']];
  const ballColor = n => COLOR_RANGES.find(([max]) => n <= max)[1];
  const rand = (a, b) => a + Math.random() * (b - a);
  const $ = id => document.getElementById(id);
  const canvas = $('c');

  // ---------- 렌더러 / 씬 ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', '<div id="nowebgl">이 브라우저에서는 WebGL을 사용할 수 없어요.</div>');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x201a40, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.75);
  key.position.set(4, 12, 14);
  scene.add(key);
  const fill = new THREE.PointLight(0x7fa8ff, 0.35, 80);
  fill.position.set(-10, 0, 10);
  scene.add(fill);
  const warm = new THREE.PointLight(0xffd27f, 0.5, 80);
  warm.position.set(10, -6, 8);
  scene.add(warm);

  // 보드
  const boardMat = new THREE.MeshStandardMaterial({ color: 0x05071a, metalness: 0.1, roughness: 1.0 });
  const board = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + 0.6, 26, 0.5), boardMat);
  board.position.set(0, 1.5, -0.6);
  scene.add(board);
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xd8b64a, metalness: 0.9, roughness: 0.3 });
  for (const sx of [-1, 1]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 26, 1.3), goldMat);
    wall.position.set(sx * (HW + 0.15), 1.5, 0);
    scene.add(wall);
  }
  const topBar = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + 0.6, 0.3, 1.3), goldMat);
  topBar.position.set(0, 14.65, 0);
  scene.add(topBar);

  // 보드 위 요소 (매 판 새로 생성)
  const boardGroup = new THREE.Group();
  scene.add(boardGroup);
  let pegs = [], holes = [], segments = [];
  const pegGeo = new THREE.CylinderGeometry(0.24, 0.24, 1.1, 18);
  pegGeo.rotateX(Math.PI / 2);
  const bumperGeo = new THREE.CylinderGeometry(0.62, 0.7, 1.1, 32);
  bumperGeo.rotateX(Math.PI / 2);
  const bumperRingGeo = new THREE.TorusGeometry(0.72, 0.07, 10, 40);
  const holeGeo = new THREE.CircleGeometry(0.55, 40);
  const holeRingGeo = new THREE.TorusGeometry(0.58, 0.07, 10, 40);
  const dividerGeo = new THREE.BoxGeometry(0.2, 2.2, 0.9);

  function makeLabelTexture(text, color, bg) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, 256, 96);
    g.fillStyle = color;
    g.font = '900 56px "Arial Black", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 52);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const goalTex = makeLabelTexture('GOAL', '#3a2a00', '#ffd23f');
  const outTex = makeLabelTexture('OUT', '#c9cbe0', '#2a2f4d');

  function disposeGroup(g) {
    while (g.children.length) {
      const m = g.children.pop();
      if (m.material && m.material.map && m.material.map !== goalTex && m.material.map !== outTex) m.material.map.dispose();
      if (m.material && !m.material.__shared) m.material.dispose();
    }
  }

  function buildBoard() {
    disposeGroup(boardGroup);
    pegs = []; holes = []; segments = [];

    // 핀 격자 (지그재그, 약간의 랜덤 흔들림, 일부는 빠짐)
    const rows = 10;
    for (let row = 0; row < rows; row++) {
      const y = 10.2 - row * 1.72;
      const offset = row % 2 ? 1.0 : 0;
      for (let x = -6.5 + offset; x <= 6.51; x += 2.0) {
        if (Math.random() < 0.12) continue;
        // 벽과의 틈이 공 지름보다 항상 넓도록 x 범위 제한
        const px = Math.max(-6.6, Math.min(6.6, x + rand(-0.25, 0.25)));
        pegs.push({ x: px, y: y + rand(-0.15, 0.15), r: 0.24, bumper: false, flash: 0 });
      }
    }
    // 범퍼 3개: 근처 핀을 치우고 배치
    const bumpers = [];
    for (let i = 0; i < 3 && pegs.length; i++) {
      const cand = pegs.filter(p => p.y < 8.5 && p.y > -3 && Math.abs(p.x) < 6 && bumpers.every(b => Math.hypot(b.x - p.x, b.y - p.y) > 3.5));
      if (!cand.length) break;
      const c = cand[Math.floor(Math.random() * cand.length)];
      const b = { x: c.x, y: c.y, r: 0.65, bumper: true, flash: 0 };
      pegs = pegs.filter(p => Math.hypot(p.x - b.x, p.y - b.y) > 1.8);
      bumpers.push(b);
    }
    pegs.push(...bumpers);
    // 블랙홀 3개
    for (let i = 0; i < 3; i++) {
      let h = null;
      for (let tries = 0; tries < 40 && !h; tries++) {
        const cand = { x: rand(-6, 6), y: rand(-4, 8), r: 0.55 };
        const okPeg = pegs.every(p => Math.hypot(p.x - cand.x, p.y - cand.y) > (p.bumper ? 2.4 : 1.05));
        const okHole = holes.every(o => Math.hypot(o.x - cand.x, o.y - cand.y) > 3.5);
        if (okPeg && okHole) h = cand;
      }
      if (h) holes.push(h);
    }
    // 바닥 포켓 칸막이 (GOAL: |x| < 2, OUT: 2~5, 5~8)
    for (const x of [-5, -2, 2, 5]) {
      segments.push({ ax: x, ay: FLOOR, bx: x, by: FLOOR + 2.2, r: 0.1, divider: true });
    }
    // 양쪽 벽에서 가운데로 공을 흘려보내는 경사 가이드 (틈으로 OUT 되기도 함)
    for (const sx of [-1, 1]) {
      segments.push({ ax: sx * 7.95, ay: -3.9, bx: sx * 3.4, by: -6.5, r: 0.12 });
    }
    const segDist = (p, s) => {
      const abx = s.bx - s.ax, aby = s.by - s.ay;
      const t = Math.max(0, Math.min(1, ((p.x - s.ax) * abx + (p.y - s.ay) * aby) / (abx * abx + aby * aby)));
      return Math.hypot(p.x - (s.ax + abx * t), p.y - (s.ay + aby * t));
    };
    pegs = pegs.filter(p => segments.every(sg => segDist(p, sg) > (p.bumper ? 1.9 : 1.15)));

    // 메쉬 생성
    for (const p of pegs) {
      const mat = new THREE.MeshStandardMaterial({
        color: p.bumper ? 0xff4f8b : 0xe8ecff, metalness: p.bumper ? 0.3 : 0.6, roughness: p.bumper ? 0.4 : 0.35,
        emissive: p.bumper ? 0xff2266 : 0x6f86ff, emissiveIntensity: p.bumper ? 0.25 : 0.35
      });
      const m = new THREE.Mesh(p.bumper ? bumperGeo : pegGeo, mat);
      m.position.set(p.x, p.y, 0);
      boardGroup.add(m);
      p.mesh = m;
      if (p.bumper) {
        const ring = new THREE.Mesh(bumperRingGeo, goldMat);
        goldMat.__shared = true;
        ring.position.set(p.x, p.y, 0.35);
        boardGroup.add(ring);
      }
    }
    for (const h of holes) {
      const disc = new THREE.Mesh(holeGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
      disc.position.set(h.x, h.y, -0.3);
      boardGroup.add(disc);
      const ring = new THREE.Mesh(holeRingGeo, new THREE.MeshStandardMaterial({ color: 0x8a5cff, emissive: 0x5a2cff, emissiveIntensity: 0.9, metalness: 0.5, roughness: 0.3 }));
      ring.position.set(h.x, h.y, -0.25);
      boardGroup.add(ring);
      h.ring = ring;
    }
    for (const s of segments) {
      const len = Math.hypot(s.bx - s.ax, s.by - s.ay);
      const d = new THREE.Mesh(s.divider ? dividerGeo : new THREE.BoxGeometry(len, 0.24, 0.9), goldMat);
      d.position.set((s.ax + s.bx) / 2, (s.ay + s.by) / 2, 0);
      if (!s.divider) d.rotation.z = Math.atan2(s.by - s.ay, s.bx - s.ax);
      boardGroup.add(d);
    }
    // 포켓 라벨 + GOAL 바닥
    const pocketsX = [-6.5, -3.5, 0, 3.5, 6.5];
    for (const px of pocketsX) {
      const isGoal = px === 0;
      const label = new THREE.Mesh(new THREE.PlaneGeometry(isGoal ? 3.6 : 2.4, isGoal ? 1.1 : 0.8), new THREE.MeshBasicMaterial({ map: isGoal ? goalTex : outTex, transparent: false }));
      label.position.set(px, FLOOR + 0.6, -0.3);
      boardGroup.add(label);
      if (isGoal) {
        const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(GOAL_HALF * 2 - 0.2, 0.2, 0.9), goldMat);
        floorMesh.position.set(0, FLOOR - 0.12, 0);
        boardGroup.add(floorMesh);
        const glow = new THREE.PointLight(0xffd23f, 0.9, 6);
        glow.position.set(0, FLOOR + 0.8, 1.2);
        boardGroup.add(glow);
      }
    }
  }

  // ---------- 공 ----------
  function makeBallTexture(n) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = ballColor(n);
    g.fillRect(0, 0, 512, 256);
    for (const cx of [128, 384]) {
      g.beginPath(); g.arc(cx, 128, 80, 0, Math.PI * 2);
      g.fillStyle = '#ffffff'; g.fill();
      g.fillStyle = '#151515';
      g.font = '900 96px "Arial Black", Arial, "Helvetica Neue", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(n), cx, 136);
    }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const ballGeo = new THREE.SphereGeometry(BR, 28, 20);
  const balls = [];
  for (let n = 1; n <= N; n++) {
    const mat = new THREE.MeshStandardMaterial({ map: makeBallTexture(n), roughness: 0.35, metalness: 0.05 });
    const mesh = new THREE.Mesh(ballGeo, mat);
    mesh.visible = false;
    scene.add(mesh);
    balls.push({ n, mesh, mat, x: 0, y: 0, vx: 0, vy: 0, state: 'wait', t: 0 });
  }

  // ---------- 상태 ----------
  const G = 24, REST_PEG = 0.62, REST_BUMPER = 1.05, REST_WALL = 0.7, REST_BALL = 0.55, MAX_V = 30;
  let queue = [], running = false, nextRelease = 0, speed = 1, goals = [], goalOrder = [], sixAt = 0, finished = false, redrops = 0;
  const tweens = [];
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function newGame(rebuild) {
    if (rebuild) buildBoard();
    tweens.length = 0;
    queue = shuffle(balls.slice());
    running = false; goals = []; goalOrder = []; sixAt = 0; finished = false; redrops = 0;
    for (const b of balls) { b.state = 'wait'; b.mesh.visible = false; b.mesh.scale.setScalar(1); }
    document.querySelectorAll('#tray .slot').forEach(s => { s.classList.remove('filled'); s.style.background = ''; s.textContent = ''; });
    $('count').textContent = '0';
    $('left').textContent = '남은 공 ' + N;
    $('result').hidden = true;
    updateButtons();
  }

  function release(b) {
    b.state = 'fall';
    b.x = rand(-HW + BR + 0.4, HW - BR - 0.4);
    b.y = TOP + rand(0, 1.2);
    b.vx = rand(-3, 3);
    b.vy = rand(-2, 0);
    b.mesh.visible = true;
    b.mesh.scale.setScalar(1);
    b.mesh.position.set(b.x, b.y, 0);
  }

  // ---------- 물리 (2D, 보드 평면) ----------
  let tickAt = 0;
  function step(dt, now) {
    const falling = balls.filter(b => b.state === 'fall');
    for (const b of balls) {
      if (b.state !== 'fall' && b.state !== 'out') continue;
      if (b.state === 'fall' && b.y > FLOOR + BR + 0.3) {
        // 어딘가에 끼어 거의 멈추면 살짝 차서 빠져나오게
        if (Math.hypot(b.vx, b.vy) < 0.5) { b.slow = (b.slow || 0) + dt; } else b.slow = 0;
        if (b.slow > 0.9) { b.vx += rand(-4, 4); b.vy += rand(2, 5); b.slow = 0; }
      }
      b.vy -= G * dt;
      b.vx *= Math.max(0, 1 - 0.05 * dt);
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_V) { b.vx *= MAX_V / sp; b.vy *= MAX_V / sp; }
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // 좌우 벽
      if (b.x < -HW + BR) { b.x = -HW + BR; if (b.vx < 0) b.vx = -b.vx * REST_WALL; }
      if (b.x > HW - BR) { b.x = HW - BR; if (b.vx > 0) b.vx = -b.vx * REST_WALL; }

      if (b.state === 'out') {
        if (b.y < HIDE_Y) { b.state = 'done'; b.mesh.visible = false; }
        continue;
      }

      // 핀 / 범퍼
      for (const p of pegs) {
        const dx = b.x - p.x, dy = b.y - p.y;
        const minD = BR + p.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        b.x = p.x + nx * minD; b.y = p.y + ny * minD;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          const e = p.bumper ? REST_BUMPER : REST_PEG;
          b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
          // 약간의 무작위 튐 → 매번 다른 경로
          const j = (Math.random() - 0.5) * 1.6;
          b.vx += -ny * j; b.vy += nx * j;
          if (p.bumper) { b.vx += nx * 5; b.vy += ny * 5; p.flash = 1; playBumper(); }
          else { p.flash = Math.max(p.flash, 0.8); if (now - tickAt > 35) { tickAt = now; playTick(Math.min(1, Math.abs(vn) / 12)); } }
        }
      }
      // 블랙홀
      for (const h of holes) {
        if (Math.hypot(b.x - h.x, b.y - h.y) < h.r + 0.05) {
          b.state = 'hole'; b.t = now; b.hx = h.x; b.hy = h.y;
          h.ring.material.emissiveIntensity = 3;
          playSwoosh();
          break;
        }
      }
      if (b.state !== 'fall') continue;
      // 칸막이 (캡슐)
      for (const s of segments) {
        const abx = s.bx - s.ax, aby = s.by - s.ay;
        const t = Math.max(0, Math.min(1, ((b.x - s.ax) * abx + (b.y - s.ay) * aby) / (abx * abx + aby * aby)));
        const cx = s.ax + abx * t, cy = s.ay + aby * t;
        const dx = b.x - cx, dy = b.y - cy;
        const minD = BR + s.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        b.x = cx + nx * minD; b.y = cy + ny * minD;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + REST_PEG) * vn * nx; b.vy -= (1 + REST_PEG) * vn * ny; }
      }
      // 포켓 도착
      if (b.y < FLOOR + BR) {
        if (Math.abs(b.x) < GOAL_HALF) {
          b.y = FLOOR + BR;
          if (!finished) scoreGoal(b, now);
          else { if (b.vy < 0) b.vy = -b.vy * 0.3; b.vx *= 0.9; } // 늦게 온 공은 그냥 포켓에 쌓임
        } else {
          b.state = 'out';
        }
      }
    }
    // 공끼리 (떨어지는 공만)
    const minD = BR * 2;
    for (let i = 0; i < falling.length; i++) {
      const a = falling[i];
      if (a.state !== 'fall') continue;
      for (let j = i + 1; j < falling.length; j++) {
        const c = falling[j];
        if (c.state !== 'fall') continue;
        const dx = c.x - a.x, dy = c.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        const overlap = (minD - d) * 0.5;
        a.x -= nx * overlap; a.y -= ny * overlap; c.x += nx * overlap; c.y += ny * overlap;
        const vrel = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
        if (vrel > 0) {
          const imp = (1 + REST_BALL) * vrel * 0.5;
          a.vx -= nx * imp; a.vy -= ny * imp; c.vx += nx * imp; c.vy += ny * imp;
        }
      }
    }
  }

  function scoreGoal(b, now) {
    b.state = 'goal';
    goals.push(b.n);
    goalOrder.push(b.n);
    $('count').textContent = goals.length;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
    const end = camera.position.clone().multiplyScalar(0.45).addScaledVector(right, 6);
    tweens.push({ b, t0: now, dur: 900, start: new THREE.Vector3(b.x, b.y, 0), mid: new THREE.Vector3(b.x, b.y + 1.2, 1.5), end });
    playDing(goals.length);
    if (goals.length >= PICK_MAX) { sixAt = now; finished = true; }
  }

  function updateTweens(now) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      const u = Math.min(1, (now - tw.t0) / tw.dur);
      const m = tw.b.mesh;
      if (u < 0.35) {
        m.position.lerpVectors(tw.start, tw.mid, easeInOut(u / 0.35));
      } else {
        const k = easeOut((u - 0.35) / 0.65);
        m.position.lerpVectors(tw.mid, tw.end, k);
        m.scale.setScalar(1 + k * 1.8);
      }
      m.rotation.y += 0.15;
      if (u >= 1) {
        tweens.splice(i, 1);
        m.visible = false;
        m.scale.setScalar(1);
        tw.b.state = 'won';
        fillSlot(goals.indexOf(tw.b.n), tw.b.n);
      }
    }
  }

  function fillSlot(i, n) {
    const s = document.querySelectorAll('#tray .slot')[i];
    if (!s) return;
    s.classList.remove('filled');
    void s.offsetWidth;
    s.classList.add('filled');
    s.style.background = ballColor(n);
    s.textContent = n;
  }

  function updateVisuals(dt, now) {
    for (const b of balls) {
      if (b.state === 'fall' || b.state === 'out') {
        b.mesh.position.set(b.x, b.y, 0);
        b.mesh.rotateOnWorldAxis(AXIS_Z, -b.vx * dt / BR);
        b.mesh.rotateOnWorldAxis(AXIS_X, b.vy * dt / BR * 0.4);
      } else if (b.state === 'hole') {
        const u = Math.min(1, (now - b.t) / 380);
        b.mesh.position.set(b.hx + (b.x - b.hx) * (1 - u), b.hy + (b.y - b.hy) * (1 - u), -0.25 * u);
        b.mesh.scale.setScalar(1 - u);
        b.mesh.rotation.z += 0.4;
        if (u >= 1) { b.state = 'done'; b.mesh.visible = false; b.mesh.scale.setScalar(1); }
      }
    }
    for (const p of pegs) {
      if (p.flash > 0) {
        p.flash = Math.max(0, p.flash - dt * (p.bumper ? 2.5 : 4));
        p.mesh.material.emissiveIntensity = (p.bumper ? 0.25 : 0.35) + p.flash * (p.bumper ? 1.6 : 1.2);
        if (p.bumper) p.mesh.scale.setScalar(1 + p.flash * 0.18);
      }
    }
    for (const h of holes) {
      const m = h.ring.material;
      if (m.emissiveIntensity > 0.9) m.emissiveIntensity = Math.max(0.9, m.emissiveIntensity - dt * 5);
      h.ring.rotation.z += dt * 1.5;
    }
  }
  const AXIS_Z = new THREE.Vector3(0, 0, 1), AXIS_X = new THREE.Vector3(1, 0, 0);

  // ---------- 진행 관리 ----------
  function manage(now) {
    if (running && queue.length && now >= nextRelease) {
      release(queue.shift());
      nextRelease = now + 150 / speed;
      $('left').textContent = '남은 공 ' + queue.length;
    }
    const active = balls.some(b => b.state === 'fall' || b.state === 'hole' || b.state === 'goal');
    if (finished) {
      if ($('result').hidden && !tweens.length && (!active || now - sixAt > 3500)) finish();
      return;
    }
    if (running && !queue.length && !active) {
      // 6개를 못 채웠으면 사라진 공을 다시 떨어뜨림
      const lost = balls.filter(b => b.state === 'done' || b.state === 'out');
      if (lost.length) {
        redrops++;
        queue = shuffle(lost);
        for (const b of queue) b.state = 'wait';
        toast(`골인 ${goals.length}개… 사라진 공 ${lost.length}개를 다시 떨어뜨려요!`);
        nextRelease = now + 600;
      }
    }
  }

  function finish() {
    running = false;
    const sorted = [...goals].sort((a, b) => a - b);
    const now = new Date();
    $('resultDate').textContent = now.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
    const nums = $('resultNums');
    nums.innerHTML = '';
    sorted.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'ball2d';
      d.style.background = ballColor(n);
      d.style.animationDelay = (i * 0.08) + 's';
      d.textContent = n;
      nums.appendChild(d);
    });
    const sum = sorted.reduce((a, b) => a + b, 0);
    const odd = sorted.filter(n => n % 2).length;
    $('resultMeta').innerHTML = `골인 순서: ${goalOrder.join(' → ')}<br>합계 ${sum} · 홀 ${odd} / 짝 ${6 - odd}${redrops ? ` · 재낙하 ${redrops}회` : ''} · 행운을 빌어요 🍀`;
    saveHistory(sorted, now);
    renderHistory();
    $('result').hidden = false;
    burstConfetti();
    playFanfare();
    updateButtons();
  }

  // ---------- 카메라 ----------
  const pointer = { x: 0, y: 0 };
  function updateCamera(dt) {
    const aspect = camera.aspect;
    const halfFov = (camera.fov / 2) * Math.PI / 180;
    const distH = 14.2 / Math.tan(halfFov);
    const distW = (HW + 1.2) / (Math.tan(halfFov) * aspect);
    const dist = Math.max(distH, distW);
    const tx = pointer.x * 2.5, ty = 7 + pointer.y * 2;
    camera.position.x += (tx - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y += (ty - camera.position.y) * Math.min(1, dt * 4);
    camera.position.z = dist * 1.02;
    camera.lookAt(0, 1.2, 0);
  }
  canvas.addEventListener('pointermove', e => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });
  canvas.addEventListener('pointerdown', ensureAudio);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    confettiCanvas.width = w * (window.devicePixelRatio || 1);
    confettiCanvas.height = h * (window.devicePixelRatio || 1);
  }

  // ---------- 버튼 ----------
  function updateButtons() {
    $('drop').disabled = running || finished;
    $('drop').textContent = finished ? '✅ 추첨 완료' : (running ? '⏳ 떨어지는 중…' : '🎳 공 떨어뜨리기');
  }
  $('drop').addEventListener('click', () => {
    ensureAudio();
    if (running || finished) return;
    running = true;
    nextRelease = performance.now();
    hideHint();
    updateButtons();
  });
  $('reset').addEventListener('click', () => { ensureAudio(); newGame(true); showHint('핀과 블랙홀이 새로 배치됐어요!'); });
  $('again').addEventListener('click', () => { newGame(true); running = true; nextRelease = performance.now() + 300; updateButtons(); });
  $('speed').addEventListener('input', e => { speed = e.target.value / 100; });
  $('copy').addEventListener('click', async () => {
    const text = [...goals].sort((a, b) => a - b).join(', ');
    try { await navigator.clipboard.writeText(text); toast('복사됐어요: ' + text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('복사됐어요: ' + text); } catch (e2) { toast('복사에 실패했어요'); }
      ta.remove();
    }
  });
  $('clearHistory').addEventListener('click', () => { try { localStorage.removeItem(HIST_KEY); } catch (e) {} renderHistory(); });

  // ---------- 힌트 / 토스트 ----------
  let hintTimer;
  function showHint(msg) {
    const h = $('hint');
    h.textContent = msg; h.classList.remove('hide');
    clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 3500);
  }
  function hideHint() { $('hint').classList.add('hide'); }
  setTimeout(hideHint, 6000);
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- 기록 (유리구 버전과 공유) ----------
  const HIST_KEY = 'lotto3d.history';
  function loadHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; } }
  function saveHistory(nums, date) {
    try {
      const h = loadHistory();
      h.unshift({ date: date.toISOString(), nums, mode: 'pinball' });
      localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 20)));
    } catch (e) {}
  }
  function renderHistory() {
    const ul = $('historyList');
    ul.innerHTML = '';
    const h = loadHistory();
    if (!h.length) { ul.innerHTML = '<li>아직 기록이 없어요</li>'; return; }
    for (const item of h) {
      const li = document.createElement('li');
      const d = new Date(item.date);
      const span = document.createElement('span');
      span.className = 'date';
      span.textContent = (item.mode === 'pinball' ? '🎯 ' : '🎱 ') + d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      li.appendChild(span);
      for (const n of item.nums) {
        const b = document.createElement('span');
        b.className = 'ball2d small';
        b.style.background = ballColor(n);
        b.textContent = n;
        li.appendChild(b);
      }
      ul.appendChild(li);
    }
  }

  // ---------- 사운드 ----------
  let audioCtx = null, muted = false;
  function ensureAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function tone(f0, f1, dur, vol, type, delay) {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function playTick(v) { tone(1800 + Math.random() * 600, 900, 0.05, 0.05 + 0.1 * v, 'square'); }
  function playBumper() { tone(220, 440, 0.18, 0.2, 'sawtooth'); }
  function playSwoosh() { tone(900, 80, 0.45, 0.16, 'sine'); }
  function playDing(i) { tone(880 + i * 60, 880 + i * 60, 0.35, 0.22, 'triangle'); tone(1760 + i * 120, 1760 + i * 120, 0.25, 0.08, 'sine'); }
  function playFanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.35, 0.18, 'square', i * 0.13)); }
  $('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; });

  // ---------- 컨페티 ----------
  const confettiCanvas = $('confetti');
  const cctx = confettiCanvas.getContext('2d');
  let confetti = [];
  function burstConfetti() {
    const W = confettiCanvas.width, H = confettiCanvas.height, dpr = window.devicePixelRatio || 1;
    const colors = COLOR_RANGES.map(c => c[1]).concat(['#ffffff']);
    for (let i = 0; i < 160; i++) {
      confetti.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.45,
        vx: (Math.random() - 0.5) * 18 * dpr, vy: (-12 - Math.random() * 12) * dpr,
        w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)], life: 1
      });
    }
  }
  function drawConfetti(dt) {
    if (!confetti.length) return;
    const W = confettiCanvas.width, H = confettiCanvas.height, dpr = window.devicePixelRatio || 1;
    cctx.clearRect(0, 0, W, H);
    for (const c of confetti) {
      c.vy += 0.45 * dpr; c.x += c.vx; c.y += c.vy; c.vx *= 0.99; c.rot += c.vr; c.life -= dt * 0.35;
      cctx.save();
      cctx.globalAlpha = Math.max(0, Math.min(1, c.life));
      cctx.translate(c.x, c.y); cctx.rotate(c.rot);
      cctx.fillStyle = c.color;
      cctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      cctx.restore();
    }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 50);
    if (!confetti.length) cctx.clearRect(0, 0, W, H);
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05) * speed;
    last = now;
    const sub = 5;
    for (let i = 0; i < sub; i++) step(dt / sub, now);
    manage(now);
    updateTweens(now);
    updateVisuals(dt, now);
    updateCamera(dt / speed);
    drawConfetti(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  newGame(true);
  renderHistory();
  camera.position.set(0, 7, 40);
  requestAnimationFrame(frame);

  // 테스트/디버깅용
  window.__pinball = { balls, get goals() { return goals; }, get queue() { return queue; }, get running() { return running; }, get finished() { return finished; }, pegs: () => pegs, holes: () => holes, newGame };
})();
</script>
</body>
</html>
